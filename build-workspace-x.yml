name: Build Workspace X (Universal Offline APK)

# Kích hoạt tự động khi có code mới đẩy lên nhánh master, hoặc kích hoạt thủ công bằng nút
on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Termux APK
    runs-on: ubuntu-latest # Sử dụng máy chủ Ubuntu do GitHub cấp phát miễn phí

    steps:
      - name: 1. Tải Mã Nguồn
        uses: actions/checkout@v4

      - name: 2. Thiết lập Môi trường Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 3. Tích hợp Cầu nối Workspace X
        run: |
          echo "Chạy script android_patch.py để tiêm WXFS, WXT và cập nhật AndroidManifest..."
          # Đảm bảo bạn đã upload android_patch.py và termux-bridge.js lên kho lưu trữ
          python android_patch.py

      - name: 4. Cấp quyền thực thi cho Gradle
        run: chmod +x ./gradlew

      - name: 5. Biên dịch Universal APK (Bao gồm 4 Bootstraps)
        env:
          # Đây là biến môi trường cực kỳ quan trọng! 
          # Giá trị '0' tắt tính năng chia nhỏ APK, buộc Gradle xuất 1 file APK duy nhất 
          # chứa toàn bộ môi trường cho cả 4 chip: ARM64, ARM32, x86 và x86_64.
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: 0
        run: |
          echo "Bắt đầu tải Bootstraps và biên dịch APK..."
          ./gradlew assembleDebug

      - name: 6. Xuất Tệp APK thành quả
        uses: actions/upload-artifact@v4
        with:
          name: WorkspaceX-Universal-APK
          path: app/build/outputs/apk/debug/*.apk
